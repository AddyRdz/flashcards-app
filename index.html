<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flashcards App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <h1>Flashcards</h1>
        <button type="button">New Deck</button>
      </header>

      <aside class="sidebar">
        <h2>Decks</h2>
        <ul>
          <li class="active">Spanish Basics</li>
          <li>JavaScript</li>
          <li>History</li>
        </ul>
      </aside>

      <main class="main-content">
        <section class="card-preview">
          <p class="card-label">Card 1 of 10</p>
          <h3>¿Cómo estás?</h3>
          <p>How are you?</p>
        </section>
      </main>

      <footer class="app-footer">
        <p>Study smarter, one card at a time.</p>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
